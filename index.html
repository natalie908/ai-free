<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>klara.mezi.radky</title>
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<style>
  :root {
    --bg: #ffffff;
    --text: #0a0a0a;
    --muted: #737373;
    --line: #dbdbdb;
    --btn: #efefef;
    --blue: #0095f6;
    --ring: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #e9e9e9;
    color: var(--text);
    display: flex;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; border: 0; background: none; color: inherit; }

  /* Telefon */
  .phone {
    position: relative;
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    background: var(--bg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  @media (min-width: 500px) {
    body { align-items: center; padding: 24px 0; }
    .phone {
      height: 860px; min-height: 0;
      border-radius: 44px;
      box-shadow: 0 0 0 10px #111, 0 30px 60px rgba(0,0,0,.25);
    }
  }
  .scroll { flex: 1; overflow-y: auto; padding-bottom: 56px; }

  /* Fotky: <img> přes placeholder; když soubor chybí, img se skryje a zůstane popisek */
  .photo { position: relative; overflow: hidden; }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .photo .ph {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 8px; font-size: 11px; line-height: 1.3; color: rgba(255,255,255,.85);
  }

  /* Horní lišta */
  .topbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    height: 48px; padding: 0 16px;
    background: var(--bg);
  }
  .topbar .user { display: flex; align-items: center; gap: 4px; font-weight: 700; font-size: 20px; }
  .topbar .icons { display: flex; gap: 20px; }
  .icon { width: 24px; height: 24px; display: block; }

  /* Hlavička profilu */
  .head { display: flex; align-items: center; gap: 24px; padding: 8px 16px 12px; }
  .avatar-btn { position: relative; flex: 0 0 auto; border-radius: 50%; cursor: pointer; }
  .ring { width: 86px; height: 86px; border-radius: 50%; padding: 3px; background: var(--ring); }
  .ring-inner { width: 100%; height: 100%; border-radius: 50%; padding: 3px; background: var(--bg); }
  .avatar { width: 100%; height: 100%; border-radius: 50%; background: #a99a8a; }
  /* výřez profilovky na obličej (fotka 2:3, obličej vpravo nahoře) */
  .js-avatar img { width: 130%; height: auto; inset: auto; left: -37%; top: -18%; }
  .avatar .ph { font-size: 22px; font-weight: 600; color: #fff; }
  .hi-badge { position: absolute; right: -12px; bottom: -10px; width: 54px; height: 54px; pointer-events: none; background: #fff; border-radius: 50%; }
  .stats { flex: 1; display: flex; justify-content: space-around; text-align: center; }
  .stats b { display: block; font-size: 17px; }
  .stats span { font-size: 13px; }

  .bio { padding: 0 16px; font-size: 14px; line-height: 1.35; }
  .bio .name { font-weight: 600; }
  .bio .cat { color: var(--muted); }
  .bio .link { color: #00376b; font-weight: 500; display: flex; align-items: center; gap: 4px; }

  .actions { display: flex; gap: 6px; padding: 14px 16px 14px; }
  .actions button {
    flex: 1; height: 32px; border-radius: 8px;
    background: var(--btn); font-weight: 600; font-size: 14px;
  }
  .actions .follow { background: var(--blue); color: #fff; }
  .actions .sq { flex: 0 0 34px; display: grid; place-items: center; }

  /* Taby + mřížka (příspěvky nejsou klikací) */
  .tabs { display: flex; border-top: 1px solid var(--line); }
  .tabs button { flex: 1; height: 44px; display: grid; place-items: center; color: var(--muted); }
  .tabs button.active { color: var(--text); box-shadow: inset 0 -1px 0 var(--text); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
  .post { aspect-ratio: 4 / 5; pointer-events: none; user-select: none; }
  .post .pin { position: absolute; top: 8px; right: 8px; width: 18px; height: 18px; z-index: 1; filter: drop-shadow(0 0 1.5px rgba(255,255,255,.9)); }
  .post.clickable { pointer-events: auto; cursor: pointer; }
  .post.contain img { object-fit: contain; padding: 6%; }

  /* Spodní navigace */
  .bottombar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
    height: 52px; background: var(--bg); border-top: 1px solid var(--line);
    display: flex; justify-content: space-around; align-items: center;
  }
  .mini-avatar { width: 26px; height: 26px; border-radius: 50%; background: #a99a8a; }
  .mini-avatar .ph { font-size: 10px; font-weight: 600; color: #fff; padding: 0; }

  /* Detail příspěvku */
  .detail { position: absolute; inset: 0; z-index: 15; background: var(--bg); display: none; flex-direction: column; }
  .detail.open { display: flex; }
  .detail-top { display: flex; align-items: center; gap: 16px; height: 48px; padding: 0 12px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 16px; }
  .detail-top button { cursor: pointer; display: grid; place-items: center; }
  .detail-top small { display: block; font-size: 12px; color: var(--muted); font-weight: 400; text-transform: uppercase; }
  .detail-body { flex: 1; overflow-y: auto; padding-bottom: 60px; }
  .d-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; font-size: 14px; font-weight: 600; }
  .d-head .mini-avatar { width: 32px; height: 32px; }
  .d-head .dots { margin-left: auto; font-size: 18px; letter-spacing: 1px; }
  .d-img { aspect-ratio: 4 / 5; }
  .d-img.contain img { object-fit: contain; padding: 6%; }
  .d-actions { display: flex; gap: 16px; padding: 10px 12px 6px; }
  .d-actions .save { margin-left: auto; }
  .d-text { padding: 0 12px; font-size: 14px; line-height: 1.4; }
  .d-text .likes { font-weight: 600; margin-bottom: 4px; }
  .d-text .muted { color: var(--muted); margin-top: 6px; }
  .d-text .date { color: var(--muted); font-size: 12px; margin-top: 6px; }

  /* Story viewer */
  .story {
    position: absolute; inset: 0; z-index: 20;
    background: #000; color: #fff;
    display: none; flex-direction: column;
    animation: pop .18s ease-out;
  }
  .story.open { display: flex; }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
  .bars { display: flex; gap: 4px; padding: 10px 8px 0; position: absolute; top: 0; left: 0; right: 0; z-index: 3; }
  .bar { flex: 1; height: 2px; background: rgba(255,255,255,.35); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #fff; }
  .story-head {
    position: absolute; top: 20px; left: 0; right: 0; z-index: 3;
    display: flex; align-items: center; gap: 8px; padding: 0 12px;
    font-size: 14px; text-shadow: 0 1px 2px rgba(0,0,0,.4);
  }
  .story-head .mini-avatar { width: 32px; height: 32px; }
  .story-head b { font-weight: 600; }
  .story-head .time { opacity: .75; }
  .story-head .close { margin-left: auto; font-size: 28px; line-height: 1; padding: 4px 6px; cursor: pointer; }
  .slide { flex: 1; background: #3b3530; }
  .slide img { object-fit: contain; }
  /* ztmavení nahoře/dole, aby bílé ovládání bylo čitelné i na světlé story */
  .story::before, .story::after { content: ""; position: absolute; left: 0; right: 0; height: 110px; z-index: 2; pointer-events: none; }
  .story::before { top: 0; background: linear-gradient(rgba(0,0,0,.35), transparent); }
  .story::after { bottom: 0; background: linear-gradient(transparent, rgba(0,0,0,.35)); }
  .slide .ph { font-size: 14px; padding: 80px 32px; }
  .slide .overlay {
    position: absolute; left: 0; right: 0; bottom: 120px;
    display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 1;
  }
  .slide .caption {
    font-size: 20px; font-weight: 600; line-height: 1.25;
    background: rgba(255,255,255,.92); color: #222; padding: 6px 12px; border-radius: 6px;
  }
  .slide .sticker { font-size: 13px; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .tap { position: absolute; top: 60px; bottom: 70px; z-index: 2; cursor: pointer; }
  .tap.prev { left: 0; width: 35%; }
  .tap.next { right: 0; width: 65%; }
  .story-foot {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 3;
    display: flex; gap: 10px; align-items: center; padding: 12px 14px 18px;
  }
  .story-foot .reply {
    flex: 1; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,.6);
    display: flex; align-items: center; padding: 0 16px; font-size: 14px; opacity: .9;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="scroll">
    <header class="topbar">
      <div class="user">
        <span class="js-username"></span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="icons">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.5-9.5-9A5 5 0 0 1 12 6a5 5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </div>
    </header>

    <section class="head">
      <button class="avatar-btn" id="avatarBtn" aria-label="Zobrazit příběh">
        <div class="ring"><div class="ring-inner"><div class="avatar photo js-avatar"></div></div></div>
        <img class="hi-badge" src="img/human-inside-logo.png" alt="Human Inside">
      </button>
      <div class="stats" id="stats"></div>
    </section>

    <section class="bio" id="bio"></section>

    <section class="actions">
      <button class="follow">Sledovat</button>
      <button>Zpráva</button>
      <button class="sq" aria-label="Doporučené">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M19 8v6M16 11h6"/></svg>
      </button>
    </section>

    <nav class="tabs">
      <button class="active" aria-label="Příspěvky">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
      </button>
      <button aria-label="Reels">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M3 8h18M8 3l3 5M14 3l3 5"/><path d="m10 12 5 3-5 3z" fill="currentColor"/></svg>
      </button>
      <button aria-label="Označené">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="10" r="3"/><path d="M6.5 19c1-3 3-4 5.5-4s4.5 1 5.5 4"/></svg>
      </button>
    </nav>

    <section class="grid" id="grid"></section>
  </div>

  <nav class="bottombar">
    <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11h3v10h5v-6h4v6h5V11h3z"/></svg>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-5-5"/></svg>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m10 9 5 3-5 3z" fill="currentColor"/></svg>
    <div class="mini-avatar photo js-avatar"></div>
  </nav>

  <!-- Detail příspěvku -->
  <div class="detail" id="detail" role="dialog" aria-modal="true">
    <div class="detail-top">
      <button id="detailBack" aria-label="Zpět">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div><small class="js-username"></small>Příspěvky</div>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </div>

  <!-- Story viewer -->
  <div class="story" id="story" role="dialog" aria-modal="true">
    <div class="bars" id="bars"></div>
    <div class="story-head">
      <div class="mini-avatar photo js-avatar"></div>
      <b class="js-username"></b>
      <span class="time" id="storyTime"></span>
      <button class="close" id="closeBtn" aria-label="Zavřít">×</button>
    </div>
    <div class="slide photo" id="slide"></div>
    <button class="tap prev" id="tapPrev" aria-label="Předchozí"></button>
    <button class="tap next" id="tapNext" aria-label="Další"></button>
    <div class="story-foot">
      <div class="reply">Poslat zprávu…</div>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.5-9.5-9A5 5 0 0 1 12 6a5 5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 3 11 14M22 3l-7 18-4-7-7-4z"/></svg>
    </div>
  </div>
</div>

<script>
/* ===== DATA – fiktivní postava. Fotky patří do složky img/ (viz img/README.md) ===== */
const PROFILE = {
  username: "klara.mezi.radky",
  name: "Klára",
  category: "Copywriter",
  bio: [
    "Slova na zakázku &amp; kapitoly z lásky.",
    "Někde mezi prvním románem a pátým dripem.",
    "Brno! Brno! Brno!"
  ],
  link: "linktr.ee/klara.mezi.radky",
  stats: { posts: 9, followers: 287, following: 342 },
  avatar: { src: "img/avatar.webp", label: "K" }
};

/* Jediný příběh – kroužek zůstává vždy „nezobrazený“ */
const STORY = {
  time: "2 h",
  slides: [
    { src: "img/human-inside-logo-post.png", bg: "#fff", label: "Human Inside logo" },
    { src: "img/human-inside.png", bg: "#fff", label: "Human Inside" }
  ]
};

/* Příspěvky v mřížce – nejnovější první */
const POSTS = [
  { src: "img/human-inside-logo-post.png", bg: "#fff", label: "Human Inside logo", pinned: true, contain: true, open: true,
    likes: 71, comments: 9, date: "3. října",
    caption: "Odteď tohle malé kolečko uvidíte u všeho, co tu sdílím 🤍 Texty, fotky i nápady jsou moje. Žádná AI." },
  { src: "img/human-inside.png", bg: "#fff", label: "Human Inside", pinned: true, open: true,
    likes: 58, comments: 6, date: "3. října",
    caption: "Díky za podporu všech AI-free autorů &lt;3" },
  { src: "img/post-8.webp", bg: "#c9a07a", label: "západ slunce u moře" },
  { src: "img/post-1.png",  bg: "#5a4330", label: "knihovna" },
  { src: "img/post-4.webp", bg: "#8fb3c9", label: "knihy nad cestou (festival)" },
  { src: "img/post-2.webp", bg: "#d8d2c6", label: "káva" },
  { src: "img/post-6.webp", bg: "#a9b98a", label: "kniha s kytkami na louce" },
  { src: "img/post-5.webp", bg: "#3a3f8f", label: "instalace z knih (veletrh)" },
  { src: "img/post-9.png",  bg: "#6b4a3a", label: "ruka proti slunci" }
];

/* ===== RENDER ===== */
const $ = id => document.getElementById(id);
// popisek leží pod fotkou – je vidět, jen když soubor chybí
const photo = (src, label) =>
  `<div class="ph">${label}</div><img src="${src}" alt="" onerror="this.remove()">`;

document.querySelectorAll(".js-username").forEach(el => el.textContent = PROFILE.username);
document.querySelectorAll(".js-avatar").forEach(el => el.innerHTML = photo(PROFILE.avatar.src, PROFILE.avatar.label));

const s = PROFILE.stats;
$("stats").innerHTML = `
  <div><b>${s.posts}</b><span>${s.posts >= 2 && s.posts <= 4 ? "příspěvky" : s.posts === 1 ? "příspěvek" : "příspěvků"}</span></div>
  <div><b>${s.followers}</b><span>sledujících</span></div>
  <div><b>${s.following}</b><span>sleduje</span></div>`;

$("bio").innerHTML = `
  <div class="name">${PROFILE.name}</div>
  <div class="cat">${PROFILE.category}</div>
  <div>${PROFILE.bio.join("<br>")}</div>
  <div class="link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
    ${PROFILE.link}
  </div>`;

const PIN = `<svg class="pin" viewBox="0 0 24 24" fill="#262626"><path d="M15 3l6 6-3 1-4 4 1 5-2 2-4-4-5 5-1-1 5-5-4-4 2-2 5 1 4-4z"/></svg>`;
$("grid").innerHTML = POSTS.map((p, i) =>
  `<div class="post photo${p.contain ? " contain" : ""}${p.open ? " clickable" : ""}" data-i="${i}" style="background:${p.bg}">${photo(p.src, p.label)}${p.pinned ? PIN : ""}</div>`).join("");

/* ===== DETAIL PŘÍSPĚVKU (jen příspěvky s open: true) ===== */
const ICONS = {
  heart: '<path d="M12 21s-7-4.5-9.5-9A5 5 0 0 1 12 6a5 5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/>',
  comment: '<path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.4A8.5 8.5 0 1 1 21 12z"/>',
  share: '<path d="M22 3 11 14M22 3l-7 18-4-7-7-4z"/>',
  save: '<path d="M19 21l-7-5-7 5V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1z"/>'
};
const ico = (k, cls = "") => `<svg class="icon ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ICONS[k]}</svg>`;

function openPost(p) {
  $("detailBody").innerHTML = `
    <div class="d-head"><div class="mini-avatar photo">${photo(PROFILE.avatar.src, PROFILE.avatar.label)}</div>${PROFILE.username}<span class="dots">···</span></div>
    <div class="d-img photo${p.contain ? " contain" : ""}" style="background:${p.bg}">${photo(p.src, p.label)}</div>
    <div class="d-actions">${ico("heart")}${ico("comment")}${ico("share")}${ico("save", "save")}</div>
    <div class="d-text">
      <div class="likes">To se líbí ${p.likes} uživatelům</div>
      <div><b>${PROFILE.username}</b> ${p.caption || ""}</div>
      ${p.comments ? `<div class="muted">Zobrazit všechny komentáře (${p.comments})</div>` : ""}
      <div class="date">${p.date || ""}</div>
    </div>`;
  $("detailBody").scrollTop = 0;
  $("detail").classList.add("open");
}
const closePost = () => $("detail").classList.remove("open");

$("grid").addEventListener("click", e => {
  const el = e.target.closest(".post.clickable");
  if (el) openPost(POSTS[+el.dataset.i]);
});
$("detailBack").addEventListener("click", closePost);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("story").classList.contains("open")) closePost();
});

/* ===== STORY VIEWER ===== */
const DURATION = 6000;
let idx = 0, start = 0, elapsed = 0, raf = null, paused = false;
const slides = STORY.slides;

function openStory() {
  idx = 0;
  $("storyTime").textContent = STORY.time;
  $("bars").innerHTML = slides.map(() => '<div class="bar"><i></i></div>').join("");
  $("story").classList.add("open");
  show();
}

function closeStory() {
  cancelAnimationFrame(raf);
  $("story").classList.remove("open");
}

function show() {
  const sl = slides[idx];
  $("slide").style.background = sl.bg;
  $("slide").innerHTML = photo(sl.src, sl.label) + `
    <div class="overlay">
      ${sl.caption ? `<div class="caption">${sl.caption}</div>` : ""}
      ${sl.sticker ? `<div class="sticker">${sl.sticker}</div>` : ""}
    </div>`;
  [...$("bars").children].forEach((b, i) => b.firstElementChild.style.width = i < idx ? "100%" : "0");
  elapsed = 0; start = performance.now(); paused = false;
  cancelAnimationFrame(raf); tick();
}

function tick() {
  raf = requestAnimationFrame(now => {
    if (!paused) {
      const p = Math.min(1, (elapsed + now - start) / DURATION);
      $("bars").children[idx].firstElementChild.style.width = p * 100 + "%";
      if (p >= 1) return next();
    }
    tick();
  });
}

function next() { idx < slides.length - 1 ? (idx++, show()) : closeStory(); }
function prev() { if (idx > 0) idx--; show(); }

function pause() { if (!paused) { paused = true; elapsed += performance.now() - start; } }
function resume() { if (paused) { paused = false; start = performance.now(); } }

/* Podržení prstu = pauza, krátký tap = další/předchozí */
["tapPrev", "tapNext"].forEach(id => {
  const el = $(id); let down = 0;
  el.addEventListener("pointerdown", () => { down = Date.now(); pause(); });
  el.addEventListener("pointerup", () => {
    resume();
    if (Date.now() - down < 250) id === "tapNext" ? next() : prev();
  });
  el.addEventListener("pointerleave", resume);
});

$("closeBtn").addEventListener("click", closeStory);
document.addEventListener("keydown", e => {
  if (!$("story").classList.contains("open")) return;
  if (e.key === "Escape") closeStory();
  if (e.key === "ArrowRight") next();
  if (e.key === "ArrowLeft") prev();
});

$("avatarBtn").addEventListener("click", openStory);
</script>
